[package]
name = "openvm-extra-executor"
version = "0.1.0"
edition = "2021"
description = "Runs one OpenVM guest ELF with one input vector and writes its public values (act-extra)."
publish = false

# OpenVM at tag v2.1.0-preview, the version eth-act/ere pins. The lockfile
# started from docker/build-openvm/openvm-elf-runner, which uses the same pin.
[dependencies]
openvm-sdk = { git = "https://github.com/openvm-org/openvm", rev = "538c5488130da56c8442d33445efe3c1fe5ea8b8" }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm", rev = "538c5488130da56c8442d33445efe3c1fe5ea8b8" }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", branch = "develop-v2.1.0", default-features = false }

[workspace]

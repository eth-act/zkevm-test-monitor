[package]
name = "act4-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
chrono = "0.4"
tempfile = "3"
libc = "0.2"

# ere path (`--features ere`): runs ELFs on the official ere images. Pinned to an ere
# revision; use the release tag once ere publishes one that contains this revision.
ere-dockerized = { git = "https://github.com/eth-act/ere", rev = "77e2aae2b92bc0231a3603749ee1a30f8e89c87d", optional = true }

[features]
# Optional so that the native path's build does not fetch or compile ere-dockerized;
# only the ere path (BACKEND=ere, src/test.sh) builds with `--features ere`.
ere = ["dep:ere-dockerized"]

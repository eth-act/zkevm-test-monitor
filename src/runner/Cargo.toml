[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
chrono = "0.4"
tempfile = "3"
libc = "0.2"

# ere path (`--features ere`): runs ELFs on the official ere images of this release
# (Cargo.lock holds its commit, 4d21321, which is also the image tag).
ere-dockerized = { git = "https://github.com/eth-act/ere", tag = "v0.20.2", optional = true }

[features]
# Optional so that the noere path's build does not fetch or compile ere-dockerized;
# only the ere path (BACKEND=ere, src/run-isa-tests.sh) builds with `--features ere`.
ere = ["dep:ere-dockerized"]

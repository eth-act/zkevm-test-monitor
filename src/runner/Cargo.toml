[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
chrono = "0.4"
tempfile = "3"
libc = "0.2"

# ere path (`--features ere`): runs ELFs on the official ere images. Pinned to an ere
# revision; use the release tag once ere publishes one that contains this revision.
ere-dockerized = { git = "https://github.com/eth-act/ere", rev = "de784c6d1a0bb82b8cfd9e48b13d4dbabd8957df", optional = true }

[features]
# Optional so that the noere path's build does not fetch or compile ere-dockerized;
# only the ere path (BACKEND=ere, src/run-isa-tests.sh) builds with `--features ere`.
ere = ["dep:ere-dockerized"]

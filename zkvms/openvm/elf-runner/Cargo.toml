[package]
name = "openvm-binary"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "openvm-binary"
path = "src/main.rs"

[dependencies]
# OpenVM SDK v2.1.0-preview, from the same sources that ere's OpenVM prover uses:
# eth-act/ere pins han0110/openvm `patch/v2.1.0-preview` (v2.1.0-preview plus one
# commit that takes Plonky3 from git) and han0110/stark-backend
# `patch/v2.1.0-preview`. The `cuda` feature transparently switches
# `Sdk`/`DefaultStarkEngine` to the GPU engine (BabyBearPoseidon2GpuEngine), so
# the same source proves on the GPU. `parallel` + `jemalloc` are on by default.
openvm-sdk = { git = "https://github.com/han0110/openvm", rev = "a391b22ebb5305fa52d3394abfd0810df4baff90", features = ["cuda"] }
# app_params_with_100_bits_security / MAX_APP_LOG_STACKED_HEIGHT. Must come from the
# same stark-backend source as openvm-sdk so Cargo unifies the two (Cargo.lock
# pins 77ed6b3b, the commit ere uses).
openvm-stark-sdk = { git = "https://github.com/han0110/stark-backend.git", branch = "patch/v2.1.0-preview", default-features = false }

clap = { version = "4", features = ["derive"] }
eyre = "0.6"

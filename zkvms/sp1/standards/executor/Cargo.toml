[package]
name = "sp1-eth-act-standards-executor"
version = "0.1.0"
edition = "2021"
description = "Runs one SP1 guest ELF with one stdin chunk and writes its public values (eth-act standards tests)."
publish = false

# The path dependencies point into the SP1 checkout in the platform image.
[dependencies]
sp1-core-executor = { path = "/sp1/crates/core/executor" }
sp1-core-executor-runner = { path = "/sp1/crates/core/runner" }

[workspace]

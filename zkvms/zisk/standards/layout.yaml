# ZisK memory layout for the eth-act standards layout/ tests (memory-layout-restrictions
# standard). From the ZisK source at v1.3.0-alpha (02d2ae7b, the commit that
# zkvms/zisk/standards/Dockerfile pins); paths are in github.com/0xPolygonHermez/zisk.

# The vendor's linker script in its repository, or none.
linker_script: ziskbuild/zisk_linker_script.ld

# Memory that the zkVM defines, from its source (not from the linker script).
# start is the first byte, end is one past the last byte.
regions:
  - name: rom
    start: 0x80000000
    end: 0x88000000
    source: core/src/mem.rs:137-139 (ROM_ADDR, ROM_SIZE)
  - name: ram
    start: 0xa0000000
    end: 0xc0000000
    source: core/src/mem.rs:113-115 (RAM_ADDR, RAM_SIZE)

# The vendor's linker symbols for the heap and the stack, or none. heap_start and
# stack_bottom are the lowest byte; heap_end and stack_top are one past the
# highest byte.
symbols:
  heap_start: _heap_bottom          # ziskbuild/zisk_linker_script.ld:140
  heap_end: _heap_top               # ziskbuild/zisk_linker_script.ld:141
  stack_bottom: _init_stack_bottom  # ziskbuild/zisk_linker_script.ld:103
  stack_top: _init_stack_top        # ziskbuild/zisk_linker_script.ld:105 (ziskos/entrypoint/src/lib.rs:374)
